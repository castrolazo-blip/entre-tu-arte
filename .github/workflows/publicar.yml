# Publica la web en GitHub Pages cada vez que hay cambios en main.
# Requisito (una sola vez): Settings › Pages › Build and deployment › Source = "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El sitio vive en la raíz del dominio propio entretuarte.com. (Sin dominio propio haría
      # falta VITE_BASE = "/entre-tu-arte/" como variable del repositorio.)
      - run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
      # GitHub Pages no conoce las rutas de la app (/obra/12…): 404.html carga la misma app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
